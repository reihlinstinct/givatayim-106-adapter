[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "givatayim-106-adapter"
version = "0.1.0"
description = "Fill-only Givatayim municipal form browser adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright==1.64.1"]
[project.optional-dependencies]
dev = ["coverage>=7.10,<8", "ruff==0.16.9", "mypy>=1.19,<3", "bandit>=1.8,<2", "pip-audit>=2.9,<3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.coverage.run]
branch = true
source = ["givatayim_adapter"]
[tool.coverage.report]
fail_under = 80
show_missing = true
[tool.ruff]
target-version = "py311"
line-length = 88
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
files = ["src"]
python_version = "3.11"
